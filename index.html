<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sets: Cards Game - Universal Competition Edition</title>
    <style>
        body {
            background-color: #181e2c;
            color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #222a3c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 600px;
        }
        h1 { color: #f0f4f8; margin-bottom: 10px; }
        p { color: #a0afc3; }
        .btn {
            background-color: #4e73df;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #3b5cb8; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #bd2130; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #a0afc3;
            width: 70%;
            text-align: center;
            margin: 15px 0;
        }
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .card {
            background: white;
            color: #222a3c;
            padding: 20px 10px;
            width: 90px;
            height: 120px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-size: 14px;
            text-align: center;
        }
        .card:hover { transform: translateY(-5px); background: #f8f9fa; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #3b4863;
            text-align: center;
        }
        th { color: #a0afc3; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Dynamic Content Loaded Here -->
</div>

<script>
    const CATEGORIES = {
        "Cars": ["Ferrari", "Tesla", "BMW", "Audi", "Porsche", "Lamborghini", "Ford", "Chevrolet", "Toyota", "Honda", "Nissan", "Hyundai", "Kia", "Mazda", "Subaru", "Volkswagen", "Volvo", "Lexus"],
        "Fruits": ["Apple", "Banana", "Mango", "Orange", "Strawberry", "Grapes", "Pineapple", "Watermelon", "Peach", "Kiwi", "Cherry", "Blueberry", "Blackberry", "Plum", "Pear", "Lemon", "Lime", "Papaya"],
        "Colors": ["Crimson", "Azure", "Emerald", "Amber", "Violet", "Teal", "Indigo", "Magenta", "Turquoise", "Maroon", "Coral", "Lavender", "Cyan", "Gold", "Silver", "Bronze", "Salmon", "Olive"],
        "Games": ["Chess", "Monopoly", "Scrabble", "Poker", "Catan", "Uno", "Risk", "Checkers", "Cluedo", "Battleship", "Ticket to Ride", "Carcassonne", "Codenames", "Dominion", "Splendor", "Azul", "Wingspan", "Pandemic"],
        "Video Games": ["Minecraft", "Fortnite", "Zelda", "Valorant", "Mario", "Halo", "Tetris", "Pokémon", "Roblox", "GTA", "Call of Duty", "League of Legends", "Among Us", "Apex Legends", "Cyberpunk", "Skyrim", "Portal", "Undertale"]
    };

    let gameState = {
        username: "Player 1",
        mode: "Single Player",
        category: "Cars",
        players: [],
        scores: JSON.parse(localStorage.getItem("sets_scores") || "{}"),
        hands: {},
        setCalled: false
    };

    // Keyboard listener for 'S' key
    window.addEventListener("keydown", (e) => {
        if ((e.key === "s" || e.key === "S") && document.getElementById("set-btn")) {
            triggerSet();
        }
    });

    function renderMenu() {
        document.getElementById("app").innerHTML = `
            <h1>SETS: CARDS GAME</h1>
            <p>Universal Competition Edition</p>
            <button class="btn" onclick="renderUsernameScreen()">Play Game</button>
            <button class="btn btn-success" onclick="renderLeaderboard()">All-Time Leaderboard</button>
            <button class="btn" onclick="renderTutorial()">Tutorial</button>
        `;
    }

    function renderTutorial() {
        document.getElementById("app").innerHTML = `
            <h2>How to Play</h2>
            <p style="text-align: left; font-size: 14px; line-height: 1.5;">
                • <b>Categories & Cards:</b> 5 categories with 18 cards each.<br>
                • <b>Objective:</b> Collect 3 matching cards by passing unwanted cards.<br>
                • <b>SET! Button:</b> Press 'S' on keyboard, tap on mobile, or right-click the SET! button when someone gets 3 matching cards!<br>
                • <b>Scoring:</b> 1st: 10,000 pts | 2nd: 7,000 pts | 3rd: 5,000 pts | 4th: 2,000 pts | 5th: 500 pts | 6th: 0 pts
            </p>
            <button class="btn btn-success" onclick="renderMenu()">Back to Menu</button>
        `;
    }

    function renderUsernameScreen() {
        document.getElementById("app").innerHTML = `
            <h2>Enter Competitor Name</h2>
            <input type="text" id="username-input" value="${gameState.username}"><br>
            <button class="btn btn-success" onclick="saveUsername()">Continue</button>
            <button class="btn" onclick="renderMenu()">Back</button>
        `;
    }

    function saveUsername() {
        const val = document.getElementById("username-input").value.trim();
        if (val) gameState.username = val;
        renderModeSelect();
    }

    function renderModeSelect() {
        document.getElementById("app").innerHTML = `
            <h2>Select Game Mode</h2>
            <button class="btn" onclick="setMode('Single Player')">Single Player (vs AI)</button>
            <button class="btn" onclick="setMode('Offline')">Offline (3 Players 1 Device)</button>
            <button class="btn" onclick="setMode('Online')">Online (Up to 6 Players)</button><br>
            <button class="btn btn-danger" onclick="renderUsernameScreen()">Back</button>
        `;
    }

    function setMode(mode) {
        gameState.mode = mode;
        renderCategorySelect();
    }

    function renderCategorySelect() {
        let html = `<h2>Select Category</h2>`;
        for (let cat in CATEGORIES) {
            html += `<button class="btn" onclick="startGame('${cat}')">${cat}</button><br>`;
        }
        html += `<button class="btn btn-danger" onclick="renderModeSelect()" style="margin-top:10px;">Back</button>`;
        document.getElementById("app").innerHTML = html;
    }

    function startGame(cat) {
        gameState.category = cat;
        gameState.setCalled = false;

        if (gameState.mode === "Single Player") {
            gameState.players = [gameState.username, "AI Bot"];
        } else if (gameState.mode === "Offline") {
            gameState.players = [gameState.username, "Player 2", "Player 3"];
        } else {
            gameState.players = [gameState.username, "Player 2", "Player 3", "Player 4", "Player 5", "Player 6"];
        }

        gameState.hands = {};
        gameState.players.forEach(p => {
            if (!(p in gameState.scores)) gameState.scores[p] = 0;
            let items = [...CATEGORIES[cat]];
            let hand = [];
            for(let i=0; i<4; i++) {
                let idx = Math.floor(Math.random() * items.length);
                hand.push(items.splice(idx, 1)[0]);
            }
            gameState.hands[p] = hand;
        });

        renderGameplay();
    }

    function renderGameplay() {
        let pHand = gameState.hands[gameState.username];
        let cardsHtml = pHand.map((card, idx) => `
            <div class="card" onclick="passCard(${idx})">${card}<br><small style="color:#6c757d; font-size:10px;">Pass</small></div>
        `).join("");

        document.getElementById("app").innerHTML = `
            <p style="font-size: 13px; color: #a0afc3;">Category: ${gameState.category} | Mode: ${gameState.mode}</p>
            <p id="status-msg" style="color: #28a745; font-weight: bold;">Pass cards you don't want! Collect 3 matching cards!</p>
            <h3>Your Hand (${gameState.username})</h3>
            <div class="cards-container">${cardsHtml}</div>
            <p style="font-size: 11px; color: #a0afc3;">Click a card to pass it to the next player</p>
            <button id="set-btn" class="btn btn-danger" style="width: 100%; height: 60px; font-size: 20px;" onclick="triggerSet()" oncontextmenu="event.preventDefault(); triggerSet();">PRESS SET!<br><small style="font-size:11px;">(Keyboard 'S' or Right-Click works)</small></button>
        `;
    }

    function passCard(idx) {
        if (gameState.setCalled) return;
        let p1 = gameState.username;
        let passed = gameState.hands[p1].splice(idx, 1)[0];
        let nextP = gameState.players[1];
        gameState.hands[nextP].push(passed);

        let items = CATEGORIES[gameState.category];
        gameState.hands[p1].push(items[Math.floor(Math.random() * items.length)]);
        renderGameplay();
        document.getElementById("status-msg").innerText = `Passed ${passed} to ${nextP}!`;
    }

    function triggerSet() {
        if (gameState.setCalled) return;
        gameState.setCalled = true;

        let active = [...gameState.players];
        active.sort(() => Math.random() - 0.5); // Random reflex ranking simulation

        let points = [10000, 7000, 5000, 2000, 500, 0];
        let roundResults = [];

        active.forEach((p, idx) => {
            let pts = points[idx] || 0;
            gameState.scores[p] = (gameState.scores[p] || 0) + pts;
            roundResults.push({player: p, rank: idx + 1, pts: pts});
        });

        localStorage.setItem("sets_scores", JSON.stringify(gameState.scores));
        renderLeaderboardScreen(roundResults);
    }

    function renderLeaderboardScreen(roundResults) {
        let sorted = Object.entries(gameState.scores).sort((a,b) => b[1] - a[1]);
        let rows = sorted.map(([p, total], idx) => {
            let rObj = roundResults.find(r => r.player === p);
            let roundPts = rObj ? rObj.pts : 0;
            return `<tr><td>#${idx+1}</td><td>${p}</td><td style="color:#28a745;">+${roundPts}</td><td><b>${total}</b></td></tr>`;
        }).join("");

        document.getElementById("app").innerHTML = `
            <h2>Round Leaderboard</h2>
            <table>
                <tr><th>Rank</th><th>Competitor</th><th>Round</th><th>Total</th></tr>
                ${rows}
            </table>
            <button class="btn" style="margin-top:20px;" onclick="startGame('${gameState.category}')">Next Round</button>
            <button class="btn btn-success" onclick="renderMenu()">Main Menu</button>
        `;
    }

    function renderLeaderboard() {
        let sorted = Object.entries(gameState.scores).sort((a,b) => b[1] - a[1]);
        let rows = sorted.length ? sorted.map(([p, total], idx) => `
            <tr><td>#${idx+1}</td><td>${p}</td><td><b>${total}</b></td></tr>
        `).join("") : `<tr><td colspan="3">No scores recorded yet!</td></tr>`;

        document.getElementById("app").innerHTML = `
            <h2>All-Time Hall of Fame</h2>
            <table>
                <tr><th>Rank</th><th>Competitor</th><th>Total Score</th></tr>
                ${rows}
            </table>
            <button class="btn btn-success" style="margin-top:20px;" onclick="renderMenu()">Back to Menu</button>
        `;
    }

    renderMenu();
</script>

</body>
</html>
